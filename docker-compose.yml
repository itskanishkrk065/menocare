version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./menopause.db
      - SECRET_KEY=menopause-super-secret-production-key-2026-secure
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./menopause.db:/app/menopause.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
